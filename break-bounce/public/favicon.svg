<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="4" fill="#03050d"/>
  <!-- pointy goblin ears -->
  <polygon points="6,14 2,4 10,10" fill="#4fc8e8"/>
  <polygon points="26,14 30,4 22,10" fill="#4fc8e8"/>
  <!-- skull head -->
  <ellipse cx="16" cy="16" rx="11" ry="12" fill="#4fc8e8"/>
  <!-- eye sockets -->
  <ellipse cx="12" cy="15" rx="3" ry="3.2" fill="#03050d"/>
  <ellipse cx="20" cy="15" rx="3" ry="3.2" fill="#03050d"/>
  <!-- glowing red pupils -->
  <ellipse cx="12" cy="15" rx="1.4" ry="1.4" fill="#cc2222"/>
  <ellipse cx="20" cy="15" rx="1.4" ry="1.4" fill="#cc2222"/>
  <!-- jaw -->
  <rect x="10" y="22" width="12" height="4" rx="1" fill="#03050d"/>
  <!-- teeth -->
  <rect x="11.5" y="22" width="2" height="3" rx="0.3" fill="#4fc8e8"/>
  <rect x="15" y="22" width="2" height="3" rx="0.3" fill="#4fc8e8"/>
  <rect x="18.5" y="22" width="2" height="3" rx="0.3" fill="#4fc8e8"/>
</svg>
